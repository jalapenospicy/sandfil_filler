let db=null, dbOk=false, serverApi=false, state={claims:[],settings:{claimElements:[],attachmentCategories:[]}}, page='dashboard', activeClaimId=null, editor=null, viewClaimId=null, toastTimer=null, modalResolve=null, currentFallback=false;

function defaults(){return {claims:[],settings:{claimElements:DEFAULT_CLAIM_ELEMENTS.map(x=>({...x})),attachmentCategories:DEFAULT_CATEGORIES.map(x=>({...x}))}}}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB is not available'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'key'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open browser storage'))})}
function txReq(store,mode,method,value){return new Promise((resolve,reject)=>{if(!db) return reject(new Error('IndexedDB unavailable'));let tx;try{tx=db.transaction(store,mode);const obj=tx.objectStore(store);let req;if(method==='get')req=obj.get(value);else if(method==='delete')req=obj.delete(value);else req=obj.put(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Storage operation failed'));tx.onabort=()=>reject(tx.error||new Error('Storage transaction aborted'))}catch(e){reject(e)}})}
async function loadState(){
  const isLoopbackHttp=(location.protocol==='http:'||location.protocol==='https:')&&(['127.0.0.1','localhost','[::1]'].includes(location.hostname));
  if(isLoopbackHttp){
    try{
      const health=await fetch('/api/health',{cache:'no-store'});
      if(health.ok){
        const info=await health.json();
        if(info&&info.app==='SANDfil Claim Manager'){
          serverApi=true;dbOk=false;currentFallback=false;
          const response=await fetch('/api/state',{cache:'no-store'});
          if(!response.ok)throw new Error('Local database could not be read.');
          state=normalizeState(await response.json());
          updateStorageUI();renderNav();renderPage();
          return;
        }
      }
    }catch(err){console.warn('Local SANDfil database connection was not available; falling back to browser storage.',err)}
  }
  serverApi=false;
  try{db=await openDB();dbOk=true;const rec=await txReq('kv','readonly','get',STATE_KEY);if(rec&&rec.value)state=normalizeState(rec.value);else{const old=localStorage.getItem('sandfil-claim-state');state=old?normalizeState(JSON.parse(old)):defaults();await persistState()}currentFallback=false}
  catch(err){dbOk=false;currentFallback=true;try{const old=localStorage.getItem('sandfil-claim-state');state=old?normalizeState(JSON.parse(old)):defaults()}catch(e){state=defaults()}showToast('Limited browser storage is active. Claims may save in this browser, but attachment files may not persist. Export backups regularly.',true,9000)}
  updateStorageUI();renderNav();renderPage()
}
function updateStorageUI(){const badge=$('#storageModeBadge'),note=$('#storageNoteText');if(badge)badge.textContent=serverApi?'● Local database connected':(dbOk?'● Browser storage active':'● Limited browser storage');if(note)note.textContent=serverApi?'Claims and attachments are saved in this folder’s DATA directory and are available in Chrome or Opera on this computer.':'Claim information and files stay in this browser. Use Backup & Restore to move records to another browser.'}

function normalizeState(s){const d=defaults();s=s&&typeof s==='object'?s:{};return {claims:Array.isArray(s.claims)?s.claims:[],settings:{claimElements:Array.isArray(s.settings?.claimElements)?s.settings.claimElements:d.settings.claimElements,attachmentCategories:Array.isArray(s.settings?.attachmentCategories)?s.settings.attachmentCategories:d.settings.attachmentCategories}}}
async function persistState(skipCloud=false){try{if(serverApi){const res=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!res.ok){let msg='Local database save failed';try{msg=(await res.json()).error||msg}catch(e){}throw new Error(msg)}return true}if(dbOk&&db)await txReq('kv','readwrite','put',{key:STATE_KEY,value:state});try{localStorage.setItem('sandfil-claim-state',JSON.stringify(state))}catch(e){if(dbOk)showToast('IndexedDB saved your records, but the browser backup mirror is full.',true,5000);else throw new Error('Browser storage is full. Reduce attachment size or export/save your work elsewhere before closing.')}if(!skipCloud&&window.sandfilCloud?.isReady())window.sandfilCloud.queueSync(state);return true}catch(e){showToast('Save error: '+(e.message||'browser storage failed')+'. Export or copy your information before closing.',true,7000);return false}}
async function putFile(id,blob,name,type,meta={}){if(serverApi){const q=new URLSearchParams({name:name||'attachment',type:type||blob.type||'application/octet-stream',claimId:meta.claimId||'Unassigned',claimDate:meta.claimDate||today(),savedName:meta.savedName||name||'attachment',category:meta.category||'Other'});const url='/api/files/'+encodeURIComponent(id)+'?'+q.toString();const res=await fetch(url,{method:'PUT',headers:{'Content-Type':type||blob.type||'application/octet-stream'},body:blob});if(!res.ok){let msg='Local attachment save failed';try{msg=(await res.json()).error||msg}catch(e){}throw new Error(msg)}return}if(dbOk&&db){await txReq('files','readwrite','put',{id,blob,name,type,updatedAt:new Date().toISOString()});return}throw new Error('Persistent attachment storage is unavailable in this browser. Try a supported updated browser and export backups regularly.')}
async function getFile(id){if(serverApi){try{const res=await fetch('/api/files/'+encodeURIComponent(id),{cache:'no-store'});if(res.ok)return await res.blob()}catch(e){console.warn('Could not fetch attachment from local database.',e)}}if(dbOk&&db){try{const rec=await txReq('files','readonly','get',id);if(rec&&rec.blob)return rec.blob}catch(e){}}const a=findAttachmentByFileId(id);if(a?.dataUrl)return dataURLToBlob(a.dataUrl);return null}
async function deleteFile(id){if(serverApi){try{await fetch('/api/files/'+encodeURIComponent(id),{method:'DELETE'})}catch(e){console.warn('Could not remove attachment from local database.',e)}return}if(dbOk&&db){try{await txReq('files','readwrite','delete',id)}catch(e){}}}
function findAttachmentByFileId(id){for(const c of state.claims){const a=(c.attachments||[]).find(x=>x.fileId===id);if(a)return a}if(editor){const a=(editor.attachments||[]).find(x=>x.fileId===id);if(a)return a}return null}
function renderNav(){const markup=NAV.map(([id,ico,label])=>`<button class="nav-btn ${page===id?'active':''}" data-action="nav" data-page="${id}"><span class="nav-icon">${ico}</span>${label}</button>`).join('');$('#sideNav').innerHTML=markup;$('#mobileNav').innerHTML=markup}

function openModal(title,body,buttons){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=buttons.map(b=>`<button class="btn ${b.class||'btn-secondary'}" data-action="modal-choice" data-choice="${escapeHTML(b.value)}">${escapeHTML(b.label)}</button>`).join('');$('#modalBackdrop').classList.add('open');return new Promise(resolve=>{modalResolve=resolve})}

function todayLabel(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return Number.isNaN(d.valueOf())?iso:d.toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'})}
function slug(s){return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-').slice(0,54)||'Dokumen'}

function calcAmount(c){if(c.amountMode==='manual'&&safeNum(c.amountManual)!==null)return safeNum(c.amountManual);const q=safeNum(c.quantity),p=safeNum(c.unitPrice);return (q===null||p===null)?0:q*p}
function calcConverted(c){if(!c.useCurrencyConversion)return null;if(c.convertedAmountMode==='manual'&&safeNum(c.convertedAmountManual)!==null)return safeNum(c.convertedAmountManual);const a=calcAmount(c),r=safeNum(c.rate);if(r===null)return null;return c.exchangeMode==='divide'?(r===0?null:a/r):a*r}
function selectedAttachments(c){return (c.attachments||[]).filter(a=>a&&a.fileId&&a.originalName)}
function hasContent(c){return !!(c.from||c.to||c.routeDescription||c.receipts?.some(r=>r.value?.trim())||safeNum(c.quantity)!==null||safeNum(c.unitPrice)!==null||c.remarks?.trim()||selectedAttachments(c).length)}
function requiredCategories(c){return state.settings.attachmentCategories.filter(cat=>claimIsTravel(c)?cat.requiredForTravel:cat.requiredForAll)}

function readiness(c){const missing=[];if(!c.claimElementId||!claimElementName(c))missing.push('Claim Element');if(!c.claimDate)missing.push('Claim Date');if(claimIsTravel(c)){if(!String(c.from||'').trim())missing.push('From location');if(!String(c.to||'').trim())missing.push('To location')}
 if(safeNum(c.quantity)===null||safeNum(c.quantity)<=0)missing.push('Quantity');if(safeNum(c.unitPrice)===null||safeNum(c.unitPrice)<0)missing.push('Unit Price');
 const selected=selectedAttachments(c);for(const cat of requiredCategories(c)){if(!isAttachedCategory(c,cat.id))missing.push(`Supporting document: ${cat.name}`)}

function newEditor(fromClaim){let c;if(fromClaim){c=JSON.parse(JSON.stringify(fromClaim));c.attachments=Array.isArray(c.attachments)?c.attachments:[];while(c.attachments.length<5)c.attachments.push(emptySlot(c.attachments.length));c.receipts=Array.isArray(c.receipts)&&c.receipts.length?c.receipts:[{id:uid('receipt'),value:''}];}else{c={id:makeClaimId(),claimDate:today(),claimElementId:state.settings.claimElements[0]?.id||'',claimElementName:state.settings.claimElements[0]?.name||'',claimElementKind:state.settings.claimElements[0]?.kind||'general',unit:state.settings.claimElements[0]?.unit||'Unit',receipts:[{id:uid('receipt'),value:''}],from:'',to:'',routeDescription:'',quantity:'',unitPrice:'',amountMode:'auto',amountManual:null,useCurrencyConversion:false,currency:'MYR',exchangeMode:'multiply',rate:'1',convertedAmountMode:'auto',convertedAmountManual:null,remarks:'',status:'draft',attachments:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};for(let i=0;i<5;i++)c.attachments.push(emptySlot(i));}

function renderClaimsPage(){return `${pageHead('Records','All claims','Search and filter saved records, then view, edit or duplicate a claim.',`<button class="btn btn-primary" data-action="new-claim">＋ New Claim</button>`)}<div class="panel"><div class="toolbar"><input id="claimSearch" placeholder="Search claim ID, date, claim type or location…" style="flex:1;min-width:210px"/><input id="filterFromDate" type="date" title="Claim date from" style="max-width:160px"/><input id="filterToDate" type="date" title="Claim date to" style="max-width:160px"/><select id="filterType" style="max-width:220px"><option value="">All claim types</option>${state.settings.claimElements.map(e=>`<option value="${escapeHTML(e.id)}">${escapeHTML(e.name)}</option>`).join('')}</select><select id="filterStatus" style="max-width:180px"><option value="">All statuses</option><option value="draft">Draft</option><option value="incomplete">Incomplete</option><option value="ready">Ready to Enter</option><option value="entered">Entered in SANDfil</option></select><select id="sortClaims" style="max-width:150px"><option value="updated">Latest updated</option><option value="date-desc">Claim date ↓</option><option value="date-asc">Claim date ↑</option><option value="amount-desc">Amount ↓</option><option value="amount-asc">Amount ↑</option></select></div><div id="claimTableResults">${claimTable([...state.claims].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')))}</div></div><div class="footer-note">${serverApi?'Claims are stored in this computer’s local DATA folder. Use Backup &amp; Restore for a separate backup.':'Claims are stored in this browser only. Export a backup before changing devices or browsers.'}</div>`}
function renderFormPage(){if(!editor)editor=newEditor(null);const e=elementById(editor.claimElementId);editor.claimElementName=e.name;editor.claimElementKind=e.kind;editor.unit=e.unit;const selected=selectedAttachments(editor);return `${pageHead(activeClaimId?'Edit claim':'New claim',activeClaimId?'Edit claim record':'Prepare a new claim','Enter the information in the same general order as the SANDfil Claim / Cash Application form.',`<button class="btn btn-secondary" data-action="cancel-form">Cancel</button>`)}
<div class="panel"><div class="form-section"><div class="section-title"><div class="title-wrap"><span class="section-number">1</span><div><h2>Claim / Cash Application</h2><p>Claim element, date and receipt or reference numbers.</p></div></div><span class="pill pill-draft">${activeClaimId?'Editing saved record':'New record'}</span></div><div class="form-grid"><div class="field"><label for="claimElementId">Claim Element <span class="required-star">*</span></label><select id="claimElementId" data-field="claimElementId">${state.settings.claimElements.map(x=>`<option value="${escapeHTML(x.id)}" ${x.id===editor.claimElementId?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select><div class="field-help">Manage the available claim elements in Settings.</div></div><div class="field"><label for="claimDate">Claim Date <span class="required-star">*</span></label><input type="date" id="claimDate" data-field="claimDate" value="${escapeHTML(editor.claimDate||'')}"/></div><div class="field full"><label>Receipt / Reference Details</label><div class="receipt-list" id="receiptList">${renderReceipts(editor)}</div><button class="btn btn-secondary btn-small inline-add" data-action="add-receipt">＋ Add receipt / reference</button><div class="field-help">Numbers are optional. Leave blank when a receipt or reference number does not apply.</div></div></div></div>
<div class="form-section" id="locationSection"><div class="section-title"><div class="title-wrap"><span class="section-number">2</span><div><h2>Location / Journey</h2><p>Complete this section for travel claims. Use full place names.</p></div></div></div><div class="form-grid"><div class="field"><label for="from">From ${claimIsTravel(editor)?'<span class="required-star">*</span>':''}</label><input id="from" data-field="from" value="${escapeHTML(editor.from||'')}" placeholder="e.g. Menara Integriti, Kuala Lumpur"/></div><div class="field"><label for="to">To ${claimIsTravel(editor)?'<span class="required-star">*</span>':''}</label><input id="to" data-field="to" value="${escapeHTML(editor.to||'')}" placeholder="e.g. Pusat Konvensyen MBSA, Shah Alam"/></div><div class="field full"><label for="routeDescription">Route description (optional)</label><input id="routeDescription" data-field="routeDescription" value="${escapeHTML(editor.routeDescription||'')}" placeholder="Additional route notes, if needed"/></div></div>${!claimIsTravel(editor)?'<div class="notice-inline">This claim element is configured as non-travel. Location fields remain available but are not required for readiness.</div>':''}</div>
<div class="form-section"><div class="section-title"><div class="title-wrap"><span class="section-number">3</span><div><h2>Quantity, Unit Price &amp; Amount</h2><p>The amount is calculated automatically; you can override it when required.</p></div></div></div><div class="form-grid three"><div class="field"><label for="quantity">Quantity <span class="required-star">*</span></label><input id="quantity" type="number" min="0" step="any" data-field="quantity" value="${escapeHTML(editor.quantity??'')}" placeholder="Enter quantity"/><div class="field-help">Unit: <strong id="unitDisplay">${escapeHTML(unitFor(editor))}</strong></div></div><div class="field"><label for="unitPrice">Unit Price (RM) <span class="required-star">*</span></label><input id="unitPrice" type="number" min="0" step="0.0001" data-field="unitPrice" value="${escapeHTML(editor.unitPrice??'')}" placeholder="Enter applicable rate"/><div class="field-help">Enter the applicable rate yourself. No official rate is assumed.</div></div><div class="field"><label>Amount calculation</label><div class="calc-box" style="height:43px"><div><div class="calc-value" id="amountPreview">${money(calcAmount(editor))}</div><div class="calc-note" id="amountModeNote">${editor.amountMode==='manual'?'Manual override':'Quantity × unit price'}</div></div></div></div><div class="field full"><label class="toggle-line"><input type="checkbox" id="manualAmountToggle" ${editor.amountMode==='manual'?'checked':''}/><span><strong>Manually override amount</strong><br/>Use this only when the amount needs to differ from the quantity × unit price calculation.</span></label></div><div class="field ${editor.amountMode==='manual'?'':'hidden'}" id="manualAmountField"><label for="amountManual">Manual Amount (RM)</label><input id="amountManual" type="number" min="0" step="0.01" data-field="amountManual" value="${escapeHTML(editor.amountManual??'')}" placeholder="Enter adjusted amount"/></div><div class="field full"><div class="info-box" style="margin:0">Illustrative calculation only: Quantity × Unit Price = Amount. The example rate is not hardcoded or treated as an official reimbursement rate.</div></div></div></div>
<div class="form-section"><div class="section-title"><div class="title-wrap"><span class="section-number">4</span><div><h2>Currency Exchange</h2><p>Only activate exchange conversion when it applies to this claim.</p></div></div></div><div class="form-grid three"><div class="field"><label for="currency">Currency</label><select id="currency" data-field="currency">${CURRENCIES.map(([k,v])=>`<option value="${k}" ${editor.currency===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="exchangeMode">Exchange</label><select id="exchangeMode" data-field="exchangeMode" ${editor.useCurrencyConversion?'':'disabled'}><option value="multiply" ${editor.exchangeMode!=='divide'?'selected':''}>Multiply (×)</option><option value="divide" ${editor.exchangeMode==='divide'?'selected':''}>Divide (÷)</option></select></div><div class="field"><label for="rate">Rate</label><input id="rate" type="number" min="0" step="any" data-field="rate" value="${escapeHTML(editor.rate??'1')}" ${editor.useCurrencyConversion?'':'disabled'}/></div><div class="field full"><label class="toggle-line"><input id="useCurrencyConversion" type="checkbox" ${editor.useCurrencyConversion?'checked':''}/><span><strong>Use currency exchange / conversion</strong><br/>Leave this off when no foreign currency conversion is needed. When enabled, the converted amount is calculated using the selected exchange operation and editable rate.</span></label></div><div class="field full"><div class="calc-box"><div><div class="calc-label">Converted Amount (RM equivalent / reference)</div><div class="calc-note" id="convertedNote">${editor.useCurrencyConversion?`Amount ${editor.exchangeMode==='divide'?'÷':'×'} Rate`: 'Conversion not enabled'}</div></div><div class="calc-value" id="convertedPreview">${editor.useCurrencyConversion&&calcConverted(editor)!==null?money(calcConverted(editor)):'—'}</div></div><label class="toggle-line mt-12"><input id="manualConvertedToggle" type="checkbox" ${editor.convertedAmountMode==='manual'?'checked':''} ${editor.useCurrencyConversion?'':'disabled'}/><span><strong>Manually override converted amount</strong><br/>Use when an adjustment is required.</span></label><div class="field mt-12 ${editor.convertedAmountMode==='manual'&&editor.useCurrencyConversion?'':'hidden'}" id="manualConvertedField"><label for="convertedAmountManual">Manual Converted Amount (RM)</label><input id="convertedAmountManual" type="number" min="0" step="0.01" data-field="convertedAmountManual" value="${escapeHTML(editor.convertedAmountManual??'')}" placeholder="Enter adjusted converted amount"/></div><div class="field-help">Confirm your organisation’s expected exchange convention before using this result.</div></div></div></div>
<div class="form-section"><div class="section-title"><div class="title-wrap"><span class="section-number">5</span><div><h2>Remarks</h2><p>Optional explanation or additional claim context.</p></div></div></div><div class="field"><label for="remarks">Remarks</label><textarea id="remarks" data-field="remarks" placeholder="Enter remarks or explanation…">${escapeHTML(editor.remarks||'')}</textarea></div></div>
<div class="form-section"><div class="section-title"><div class="title-wrap"><span class="section-number">6</span><div><h2>Supporting Documents</h2><p>Select each file, assign a category, then download a renamed copy.</p></div></div><span class="pill pill-${readiness(editor).ready?'ready':'incomplete'}" id="readinessPill">${readiness(editor).ready?'Checks passed':'Checks incomplete'}</span></div><div class="warning-box">The default checklist is a preparation aid, not confirmation of official SANDfil policy. Your configurable required-document settings control the readiness check. A selected file counts as attached; a renamed copy must also be downloaded before a claim can be marked ready.</div><div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:17px;align-items:start"><div><div class="attachment-list" id="attachmentList">${renderAttachmentRows(editor)}</div><button class="btn btn-secondary btn-small mt-12" data-action="add-attachment">＋ Add another attachment slot</button><div class="field-help mt-12">Supported: PDF, JPG, JPEG, PNG and DOCX. Files are stored locally in this browser where browser storage permits.</div></div><div><div class="progress-label"><span>Claim completeness</span><strong id="progressPercent">${progressPercent(editor)}%</strong></div><div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:${progressPercent(editor)}%"></div></div><h3 style="font-size:12px;color:var(--navy);margin:18px 0 10px">Required document checklist</h3><div class="checklist" id="checklistPreview">${renderChecklist(editor)}</div><div id="missingSummary" class="notice-inline">${readiness(editor).ready?'All configured readiness checks are complete.':`${readiness(editor).missing.length} item(s) still need attention before marking this claim ready.`}</div></div></div></div>
<div class="form-footer"><div><div class="save-state" id="saveStatus">${activeClaimId?'Saved record loaded for editing':'New claim · not saved yet'}</div><div class="notice-inline">Claim ID: <strong>${escapeHTML(editor.id)}</strong></div></div><div class="form-footer-right"><button class="btn btn-secondary" data-action="save-draft">Save Draft</button><button class="btn btn-primary" data-action="mark-ready">✓ Mark as Ready to Enter</button></div></div></div><div class="footer-note">This workspace does not log in to, connect to or submit data to SANDfil.</div>`}
function renderReceipts(c){return (c.receipts||[]).map((r,i)=>`<div class="receipt-row"><div class="receipt-num">#${i+1}</div><input data-receipt-id="${escapeHTML(r.id)}" value="${escapeHTML(r.value||'')}" placeholder="Receipt / reference number (optional)" aria-label="Receipt reference ${i+1}"/><button data-action="remove-receipt" data-id="${escapeHTML(r.id)}" title="Remove this reference" aria-label="Remove reference">×</button></div>`).join('')}
function attachmentEntries(){const byId=new Map();for(const cl of state.claims){for(const a of selectedAttachments(cl))byId.set(a.id,{claim:cl,att:a})}if(editor){for(const a of selectedAttachments(editor))byId.set(a.id,{claim:editor,att:a})}return [...byId.values()]}
function getSuggestedFilename(c,a,excludeId){if(a.downloaded&&a.generatedName&&!a.filenameManuallyEdited)return a.generatedName;const entries=attachmentEntries();if(!entries.some(x=>x.att.id===a.id))entries.push({claim:c,att:a});const used=new Set();for(const entry of entries){const x=entry.att;if(x.id===a.id)continue;const fixed=x.customFilename||(x.downloaded&&x.generatedName?x.generatedName:'');if(fixed)used.add(fixed.toLowerCase())}for(const entry of entries){const x=entry.att;if(x.id!==a.id){const fixed=x.customFilename||(x.downloaded&&x.generatedName?x.generatedName:'');if(fixed)continue}const base=getBaseFilename(entry.claim,x);const e=extOf(base),stem=e?base.slice(0,-e.length):base;let candidate=base,n=1;while(used.has(candidate.toLowerCase())){candidate=`${stem}-${String(n++).padStart(2,'0')}${e}`;if(n>1000)break}if(x.id===a.id)return candidate;used.add(candidate.toLowerCase())}return getBaseFilename(c,a)}
function getBaseFilename(c,a){const date=c.claimDate||today();const el=claimFilenameSlug(c);let route='';if((c.from||'').trim()||(c.to||'').trim())route=`_${slug(c.from||'Lokasi')}-ke-${slug(c.to||'Lokasi')}`;return `${date}_${el}${route}_${slug(categoryById(a.categoryId).name||a.categoryName||'Dokumen')}${extOf(a.originalName)}`}
function renderAttachmentRows(c){return (c.attachments||[]).map((a,i)=>{const filled=!!(a.fileId&&a.originalName);const catOpts=state.settings.attachmentCategories.map(cat=>`<option value="${escapeHTML(cat.id)}" ${a.categoryId===cat.id?'selected':''}>${escapeHTML(cat.name)}</option>`).join('');const proposed=filled?getSuggestedFilename(c,a,a.id):'';const usedName=a.customFilename||proposed;return `<div class="attachment-card ${filled?'filled':''}" data-attachment-card="${escapeHTML(a.id)}"><div class="attachment-head"><div class="attachment-title">Attachment slot ${i+1}<small>${filled?'File selected':'Choose a file for this slot'}</small></div>${filled?`<span class="pill pill-${a.downloaded?'ready':'incomplete'}">${a.downloaded?'Renamed copy downloaded':'Action needed'}</span>`:''}</div><div class="attachment-grid"><div class="field"><label>Attachment category</label><select data-att-cat="${escapeHTML(a.id)}">${catOpts||'<option value="">No categories configured</option>'}</select></div><div class="field"><label>Choose file</label><input type="file" data-file-input="${escapeHTML(a.id)}" accept=".pdf,.jpg,.jpeg,.png,.docx,application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document"/><div class="file-meta">${filled?`Original: ${escapeHTML(a.originalName)} · ${formatBytes(a.size)} · ${escapeHTML(a.mimeType||'Unknown type')}`:'Supported formats: PDF, JPG, JPEG, PNG, DOCX'}</div></div></div>${filled?`<div class="filename-block"><div><div class="field-label">Suggested generated filename</div><div class="filename-preview">${escapeHTML(proposed)}</div></div><div class="field"><label>Filename for download (editable)</label><input data-filename="${escapeHTML(a.id)}" value="${escapeHTML(usedName)}" spellcheck="false"/></div></div><div class="attach-actions"><button class="btn btn-secondary btn-small" data-action="preview-attachment" data-id="${escapeHTML(a.id)}">↗ Preview / Open</button><button class="btn btn-primary btn-small" data-action="download-attachment" data-id="${escapeHTML(a.id)}">↓ Download renamed file</button><button class="btn btn-danger btn-small" data-action="remove-attachment" data-id="${escapeHTML(a.id)}">Remove</button></div>${a.downloaded?'<div class="download-ok">✓ Download action completed for this renamed copy. Check your Downloads folder.</div>':'<div class="download-warning">Not yet prepared: download the renamed copy before marking this claim as ready.</div>'}`:''}</div>`}).join('')}
function formatBytes(n){if(!n)return '0 B';if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/(1024*1024)).toFixed(2)+' MB'}
function renderChecklist(c){const req=requiredCategories(c);if(!req.length)return '<div class="check-item"><div class="check-label"><span class="check-icon">i</span>No required categories configured for this claim type.</div><span class="check-state optional">None configured</span></div>';return req.map(cat=>{const attached=isAttachedCategory(c,cat.id);return `<div class="check-item"><div class="check-label"><span class="check-icon ${attached?'good':''}">${attached?'✓':'!'}</span><span>${escapeHTML(cat.name)}</span></div><span class="check-state ${attached?'good':'miss'}">${attached?'Attached':'Missing'}</span></div>`}).join('')}
function progressPercent(c){let all=4,done=0;if(c.claimElementId&&c.claimDate)done++;if(!claimIsTravel(c)||((c.from||'').trim()&&(c.to||'').trim()))done++;if(safeNum(c.quantity)>0&&safeNum(c.unitPrice)!==null)done++;if(requiredCategories(c).every(cat=>isAttachedCategory(c,cat.id)))done++;if(selectedAttachments(c).every(a=>a.downloaded))done++;all=5;return Math.round(done/all*100)}
function collectFormIntoEditor(){if(!editor)return;$$('[data-field]').forEach(el=>{const key=el.dataset.field;if(key==='quantity'||key==='unitPrice'||key==='amountManual'||key==='rate'||key==='convertedAmountManual')editor[key]=el.value;else editor[key]=el.value});$$('[data-receipt-id]').forEach(el=>{const r=editor.receipts.find(x=>x.id===el.dataset.receiptId);if(r)r.value=el.value});const manual=$('#manualAmountToggle');if(manual){editor.amountMode=manual.checked?'manual':'auto';editor.amountManual=$('#amountManual')?.value??editor.amountManual}const conv=$('#useCurrencyConversion');if(conv)editor.useCurrencyConversion=conv.checked;$$('[data-att-cat]').forEach(el=>{const a=editor.attachments.find(x=>x.id===el.dataset.attCat);if(a)a.categoryId=el.value});$$('[data-filename]').forEach(el=>{const a=editor.attachments.find(x=>x.id===el.dataset.filename);if(a)a.customFilename=a.filenameManuallyEdited?el.value.trim():''});const convertedToggle=$('#manualConvertedToggle');if(convertedToggle)editor.convertedAmountMode=convertedToggle.checked?'manual':'auto';const element=elementById(editor.claimElementId);editor.claimElementName=element.name;editor.claimElementKind=element.kind;editor.unit=element.unit;}
function syncComputed(){if(!editor)return;collectFormIntoEditor();if($('#amountPreview'))$('#amountPreview').textContent=money(calcAmount(editor));if($('#amountModeNote'))$('#amountModeNote').textContent=editor.amountMode==='manual'?'Manual override':'Quantity × unit price';if($('#manualAmountField'))$('#manualAmountField').classList.toggle('hidden',editor.amountMode!=='manual');if($('#convertedPreview'))$('#convertedPreview').textContent=editor.useCurrencyConversion&&calcConverted(editor)!==null?money(calcConverted(editor)):'—';if($('#convertedNote'))$('#convertedNote').textContent=editor.useCurrencyConversion?(editor.convertedAmountMode==='manual'?'Manual override':`Amount ${editor.exchangeMode==='divide'?'÷':'×'} Rate`):'Conversion not enabled';if($('#manualConvertedField'))$('#manualConvertedField').classList.toggle('hidden',!(editor.useCurrencyConversion&&editor.convertedAmountMode==='manual'));if($('#manualConvertedToggle'))$('#manualConvertedToggle').disabled=!editor.useCurrencyConversion;if($('#readinessPill')){const r=readiness(editor);$('#readinessPill').className='pill pill-'+(r.ready?'ready':'incomplete');$('#readinessPill').textContent=r.ready?'Checks passed':'Checks incomplete'}if($('#progressPercent'))$('#progressPercent').textContent=progressPercent(editor)+'%';if($('#progressBar'))$('#progressBar').style.width=progressPercent(editor)+'%';if($('#checklistPreview'))$('#checklistPreview').innerHTML=renderChecklist(editor);if($('#missingSummary')){const r=readiness(editor);$('#missingSummary').textContent=r.ready?'All configured readiness checks are complete.':`${r.missing.length} item(s) still need attention before marking this claim ready.`}}
function rerenderAttachmentList(){if($('#attachmentList'))$('#attachmentList').innerHTML=renderAttachmentRows(editor);syncComputed()}
function renderSummaryPage(){const c=state.claims.find(x=>x.id===viewClaimId);if(!c)return `${pageHead('Claim summary','Claim not found','This record may have been deleted.')}`;const ready=readiness(c),at=selectedAttachments(c);const actionBtns=`<button class="btn btn-secondary" data-action="nav" data-page="claims">← All Claims</button><button class="btn btn-secondary" data-action="copy-summary" data-id="${escapeHTML(c.id)}">Copy Summary</button><button class="btn btn-secondary" data-action="download-summary" data-id="${escapeHTML(c.id)}">↓ Download TXT</button><button class="btn btn-primary" data-action="edit" data-id="${escapeHTML(c.id)}">Edit Claim</button>`;const receipts=(c.receipts||[]).map((r,i)=>r.value?.trim()?`#${i+1}: ${r.value}`:null).filter(Boolean).join('\n')||'Not provided';const loc=claimIsTravel(c)?`${c.from||'—'} → ${c.to||'—'}`:'Not required for this claim type';const cv=calcConverted(c);const rows=[['Claim ID',c.id],['Claim Element',claimElementName(c)],['Claim Date',todayLabel(c.claimDate)],['Receipt / Reference Details',receipts],['From',c.from||'—'],['To',c.to||'—'],['Route Description',c.routeDescription||'—'],['Quantity',`${c.quantity??'—'} ${unitFor(c)}`],['Unit Price',c.unitPrice!==''&&c.unitPrice!=null?`RM ${Number(c.unitPrice).toFixed(4)}`:'—'],['Amount',money(calcAmount(c))],['Currency',c.currency||'MYR'],['Exchange',c.useCurrencyConversion?(c.exchangeMode==='divide'?'Divide (÷)':'Multiply (×)'):'Not used'],['Rate',c.useCurrencyConversion?(c.rate??'—'):'—'],['Converted Amount',c.useCurrencyConversion&&cv!==null?money(cv):'Not applicable'],['Remarks',c.remarks||'—']];return `${pageHead('Saved record','Claim summary',`Read-only reference for ${escapeHTML(c.id)}. Review these details while entering the claim into SANDfil.`,actionBtns)}<div class="summary-layout"><div><div class="panel"><div class="panel-head"><div><h2>Claim / Cash Application</h2><p>Fields in SANDfil-style order</p></div>${statusPill(c)}</div><div class="table-wrap"><table class="summary-table"><tbody>${rows.map(([k,v])=>`<tr><th>${escapeHTML(k)}</th><td><pre>${escapeHTML(v)}</pre></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h2>Attachment checklist</h2><p>Based on your own configured checklist settings</p></div><span class="pill pill-${ready.ready?'ready':'incomplete'}">${ready.ready?'Complete':'Incomplete'}</span></div><div class="panel-body"><div class="checklist">${renderChecklist(c)}</div>${ready.ready?'<div class="success-box mt-12">All readiness checks currently pass. This does not confirm acceptance by SANDfil or your organisation.</div>':`<div class="warning-box mt-12"><strong>Still to complete</strong><ul style="padding-left:18px;margin:7px 0 0">${ready.missing.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div>`}</div></div><div class="panel"><div class="panel-head"><div><h2>Attachments</h2><p>${at.length} selected file(s)</p></div></div><div class="panel-body">${at.length?`<div class="attachment-list">${at.map(a=>`<div class="check-item"><div style="min-width:0"><div style="font-size:12px;font-weight:800;color:#345365">${escapeHTML(categoryById(a.categoryId).name)}</div><div class="subtext">Original: ${escapeHTML(a.originalName)}</div><div class="filename-preview" style="margin-top:7px">${escapeHTML(a.customFilename||(a.downloaded&&a.generatedName?a.generatedName:getSuggestedFilename(c,a,a.id)))}</div></div><span class="check-state ${a.downloaded?'good':'miss'}">${a.downloaded?'Renamed copy downloaded':'Not downloaded'}</span></div>`).join('')}</div>`:'<div class="empty"><strong>No attachments selected</strong><p>Edit the claim to add supporting documents.</p></div>'}</div></div></div><aside class="summary-side"><div class="panel"><div class="panel-head"><div><h2>Preparation status</h2><p>Based on current saved information</p></div></div><div class="panel-body"><div style="font-size:27px;color:var(--navy);font-weight:850">${progressPercent(c)}%</div><div class="progress-wrap" style="margin:8px 0 14px"><div class="progress-bar" style="width:${progressPercent(c)}%"></div></div><div class="muted" style="font-size:11px">${ready.ready?'Configured checks are complete.':`${ready.missing.length} check(s) still require attention.`}</div><div class="summary-section-title">Claim amount</div><div class="calc-box"><div><div class="calc-label">Recorded amount</div><div class="calc-value">${money(calcAmount(c))}</div></div></div><div class="summary-section-title">Journey</div><div class="detail-note">${escapeHTML(loc)}${c.routeDescription?`<br/><br/>${escapeHTML(c.routeDescription)}`:''}</div><div class="summary-section-title">Record details</div><div class="subtext">Created: ${escapeHTML(formatDateTime(c.createdAt))}</div><div class="subtext">Last updated: ${escapeHTML(formatDateTime(c.updatedAt))}</div><div class="spacer-row"></div>${c.status!=='entered'?`<button class="btn btn-secondary" style="width:100%;margin-top:10px" data-action="mark-ready-saved" data-id="${escapeHTML(c.id)}">✓ Mark as Ready to Enter</button>`:`<div class="success-box mt-12">Marked as Entered in SANDfil.</div>`}<button class="btn btn-secondary" style="width:100%;margin-top:8px" data-action="mark-entered" data-id="${escapeHTML(c.id)}">Mark Entered in SANDfil</button></div></div></aside></div>`}
function formatDateTime(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.valueOf())?v:d.toLocaleString('en-MY',{dateStyle:'medium',timeStyle:'short'})}

function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}

function exportClaimsCSV(){const headers=['Claim ID','Claim Date','Claim Element','From','To','Route Description','Quantity','Unit','Unit Price','Amount','Currency','Use Currency Conversion','Exchange','Rate','Converted Amount','Receipt / Reference Details','Remarks','Attachments Count','Attachment Original Filenames','Attachment Generated Filenames','Status','Created At','Updated At'];const rows=state.claims.map(c=>{const ats=selectedAttachments(c);return [c.id,c.claimDate,claimElementName(c),c.from,c.to,c.routeDescription,c.quantity,unitFor(c),c.unitPrice,calcAmount(c),c.currency,c.useCurrencyConversion?'Yes':'No',c.exchangeMode,c.rate,calcConverted(c),(c.receipts||[]).map(r=>r.value).filter(Boolean).join('; '),c.remarks,ats.length,ats.map(a=>a.originalName).join('; '),ats.map(a=>a.customFilename||(a.downloaded&&a.generatedName?a.generatedName:getSuggestedFilename(c,a,a.id))).join('; '),statusData(c).label,c.createdAt,c.updatedAt]});downloadText('\ufeff'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),`SANDfil_Claims_${today()}.csv`,'text/csv;charset=utf-8');showToast('Claims CSV exported.')}

function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error||new Error('Could not read attachment'));reader.readAsDataURL(blob)})}
function base64ToBlob(data,type){const binary=atob(data),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:type||'application/octet-stream'})}
function dataURLToBlob(data){const parts=data.split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';return base64ToBlob(parts[1]||'',mime)}
async function exportBackup(){try{showToast('Preparing backup…',false,10000);const files=[],seen=new Set();for(const c of state.claims){for(const a of selectedAttachments(c)){if(!a.fileId||seen.has(a.fileId))continue;seen.add(a.fileId);let blob=await getFile(a.fileId);if(!blob&&a.dataUrl)blob=dataURLToBlob(a.dataUrl);if(!blob)throw new Error(`Attachment file could not be read: ${a.originalName||a.fileId}. Re-select the file and save the claim before exporting a full backup.`);files.push({id:a.fileId,name:a.originalName||'attachment',type:a.mimeType||blob.type||'application/octet-stream',size:a.size||blob.size,dataBase64:await blobToBase64(blob)});}}const payload={format:'sandfil-claim-manager-backup',version:1,exportedAt:new Date().toISOString(),state,files};downloadText(JSON.stringify(payload,null,2),`SANDfil_Claim_Manager_Backup_${today()}.json`,'application/json;charset=utf-8');showToast(`Full backup exported (${state.claims.length} claim(s), ${files.length} file(s)).`,false,5000)}catch(e){showToast('Backup failed: '+(e.message||'could not prepare JSON').toString(),true,7000)}}
async function restoreBackup(file){try{const raw=await file.text();const backup=JSON.parse(raw);if(backup.format!=='sandfil-claim-manager-backup'||!backup.state||!Array.isArray(backup.state.claims))throw new Error('This does not look like a valid SANDfil Claim Manager backup.');const confirm=await openModal('Replace current workspace?',`<p>Import <strong>${backup.state.claims.length}</strong> claim record(s), <strong>${(backup.files||[]).length}</strong> file(s), and saved settings from this backup?</p><p><strong>Current records and settings will be replaced.</strong> Download a backup first if you want to keep them.</p>`,[{label:'Cancel',value:'cancel'},{label:'Replace & Restore',value:'restore',class:'btn-primary'}]);if(confirm!=='restore')return;const next=normalizeState(backup.state);const oldIds=new Set();for(const c of state.claims)for(const a of selectedAttachments(c))if(a.fileId)oldIds.add(a.fileId);state=next;for(const f of (backup.files||[])){const blob=base64ToBlob(f.dataBase64,f.type);if(serverApi||(dbOk&&db))await putFile(f.id,blob,f.name,f.type);else{const a=findAttachmentByFileId(f.id);if(a)a.dataUrl=await blobToDataURL(blob)}}await persistState();for(const id of oldIds){if(!state.claims.some(c=>selectedAttachments(c).some(a=>a.fileId===id)))await deleteFile(id)}activeClaimId=null;editor=null;viewClaimId=null;go('dashboard');showToast('Backup restored successfully.');}catch(e){showToast('Restore failed: '+(e.message||'invalid backup'),true,8000)}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function saveEditor(target){collectFormIntoEditor();const element=elementById(editor.claimElementId);editor.claimElementName=element.name;editor.claimElementKind=element.kind;editor.unit=element.unit;editor.updatedAt=new Date().toISOString();if(!activeClaimId){editor.createdAt=editor.createdAt||editor.updatedAt;activeClaimId=editor.id}else if(editor.status==='entered'){editor.status='draft'}
 if(target==='ready'){const r=readiness(editor);if(!r.ready){const list=r.missing.map(x=>`<li>${escapeHTML(x)}</li>`).join('');showToast('Claim cannot be marked ready yet. Review the incomplete items.',true,5000);$('#missingSummary').innerHTML=`<strong>Still to complete:</strong><ul style="padding-left:18px;margin:5px 0">${list}</ul>`;return}editor.status='ready'}else editor.status='draft';
 const saved=JSON.parse(JSON.stringify(editor));const index=state.claims.findIndex(c=>c.id===saved.id);if(index>=0)state.claims[index]=saved;else state.claims.unshift(saved);const ok=await persistState();if(!ok)return;viewClaimId=saved.id;editor=null;activeClaimId=saved.id;go('summary');showToast(target==='ready'?'Claim saved and marked Ready to Enter.':'Claim draft saved.');}
async function markSavedReady(id){const c=state.claims.find(x=>x.id===id);if(!c)return;const r=readiness(c);if(!r.ready){showToast('Cannot mark ready. Missing: '+r.missing.slice(0,3).join(', ')+(r.missing.length>3?'…':''),true,6500);return}c.status='ready';c.updatedAt=new Date().toISOString();await persistState();renderPage();showToast('Claim marked Ready to Enter.')}

async function handleFileChange(input){if(!editor)return;const aid=input.dataset.fileInput;const file=input.files&&input.files[0];if(!file)return;const allowed=['.pdf','.jpg','.jpeg','.png','.docx'];const ext=extOf(file.name);if(!allowed.includes(ext)){showToast('Unsupported file type. Choose PDF, JPG, PNG or DOCX.',true);input.value='';return}if(file.size>25*1024*1024){showToast('File is larger than 25 MB. Select a smaller file.',true);input.value='';return}const a=editor.attachments.find(x=>x.id===aid);if(!a)return;try{if(!file.type&&ext==='')throw new Error('File type could not be determined');const fileId=uid('file');if(serverApi||(dbOk&&db)){await putFile(fileId,file,file.name,file.type||'application/octet-stream',{claimId:editor.id,claimDate:editor.claimDate,savedName:getSuggestedFilename(editor,a,a.id),category:categoryById(a.categoryId).name});a.dataUrl=''}else{const data=await blobToDataURL(file);a.dataUrl=data}if(a.fileId)await deleteFile(a.fileId);a.fileId=fileId;a.originalName=file.name;a.mimeType=file.type||'application/octet-stream';a.size=file.size;a.downloaded=false;a.customFilename='';a.filenameManuallyEdited=false;a.generatedName='';showToast('File selected. Review its category and generated filename.');rerenderAttachmentList()}catch(e){showToast('Could not store this attachment: '+e.message,true,7000);input.value=''}}
async function previewAttachment(aid){collectFormIntoEditor();const a=editor.attachments.find(x=>x.id===aid);if(!a||!a.fileId)return;const win=window.open('about:blank','_blank');try{const blob=await getFile(a.fileId);if(!blob)throw new Error('Stored file could not be found. Re-select it before previewing.');const url=URL.createObjectURL(blob);if(win){win.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}else{const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='Open attachment';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),120000)}}catch(e){if(win)win.close();showToast(e.message,true)}}
function uniqueAttachmentFilename(raw,a){const ext=extOf(a.originalName);let output=String(raw||'').trim().replace(/[\\/:*?"<>|\u0000-\u001F]/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-');if(!output||output==='.')return '';const typedExt=extOf(output);if(ext){if(!typedExt)output+=ext;else if(typedExt.toLowerCase()!==ext.toLowerCase())output=output.slice(0,-typedExt.length)+ext}const used=new Set();for(const entry of attachmentEntries()){const x=entry.att;if(x.id===a.id)continue;const fn=x.customFilename||(x.downloaded&&x.generatedName?x.generatedName:getSuggestedFilename(entry.claim,x,x.id));if(fn)used.add(fn.toLowerCase())}if(!used.has(output.toLowerCase()))return output;const e=extOf(output),stem=e?output.slice(0,-e.length):output;let n=1,candidate;do{candidate=`${stem}-${String(n++).padStart(2,'0')}${e}`}while(used.has(candidate.toLowerCase())&&n<1000);return candidate}
async function downloadAttachment(aid){collectFormIntoEditor();const a=editor.attachments.find(x=>x.id===aid);if(!a||!a.fileId)return;const wasManual=!!a.filenameManuallyEdited;const raw=wasManual?(a.customFilename||''):getSuggestedFilename(editor,a,a.id);const output=uniqueAttachmentFilename(raw,a);if(!output)return showToast('Enter a valid output filename.',true);try{let blob=await getFile(a.fileId);if(!blob)throw new Error('Stored file is missing. Re-select this attachment.');if(serverApi){const res=await fetch('/api/files/'+encodeURIComponent(a.fileId)+'/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:output})});if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||'Could not rename stored file.')}}downloadBlob(blob,output);a.customFilename=wasManual?output:'';a.generatedName=output;a.downloaded=true;rerenderAttachmentList();showToast('Renamed file prepared. The organised local copy has been updated.')}catch(e){showToast('Download failed: '+e.message,true,7000)}}
function filterClaims(){const search=($('#claimSearch')?.value||'').toLowerCase().trim(),fromDate=$('#filterFromDate')?.value||'',toDate=$('#filterToDate')?.value||'',type=$('#filterType')?.value||'',status=$('#filterStatus')?.value||'',sort=$('#sortClaims')?.value||'updated';let rows=state.claims.filter(c=>{const hay=[c.id,c.claimDate,claimElementName(c),c.from,c.to,c.remarks].join(' ').toLowerCase();if(search&&!hay.includes(search))return false;if(fromDate&&(!c.claimDate||c.claimDate<fromDate))return false;if(toDate&&(!c.claimDate||c.claimDate>toDate))return false;if(type&&c.claimElementId!==type)return false;if(status&&statusData(c).class!==status)return false;return true});rows.sort((a,b)=>{if(sort==='date-desc')return (b.claimDate||'').localeCompare(a.claimDate||'');if(sort==='date-asc')return (a.claimDate||'').localeCompare(b.claimDate||'');if(sort==='amount-desc')return calcAmount(b)-calcAmount(a);if(sort==='amount-asc')return calcAmount(a)-calcAmount(b);return (b.updatedAt||'').localeCompare(a.updatedAt||'')});$('#claimTableResults').innerHTML=claimTable(rows);}
async function saveCategory(id){const cat=categoryById(id);const input=$(`[data-cat-name="${CSS.escape(id)}"]`);const travel=$(`[data-cat-travel="${CSS.escape(id)}"]`),all=$(`[data-cat-all="${CSS.escape(id)}"]`);if(!input.value.trim())return showToast('Category name cannot be empty.',true);cat.name=input.value.trim();cat.requiredForTravel=travel.checked;cat.requiredForAll=all.checked;await persistState();renderPage();showToast('Attachment category saved.')}

function renderLibraryPage(){const rows=allLibraryFiles();const total=rows.length;return `${pageHead('File management','Document Library','A central library of supporting documents attached to your saved claims.',`<button class="btn btn-primary" data-action="library-upload">＋ Upload Files</button>`)}<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat-card"><div class="stat-label">Stored files</div><div class="stat-value">${total}</div><div class="stat-foot">Across all saved claims</div></div><div class="stat-card"><div class="stat-label">PDF documents</div><div class="stat-value">${rows.filter(x=>extOf(x.att.originalName)==='.pdf').length}</div><div class="stat-foot">PDF attachments</div></div><div class="stat-card"><div class="stat-label">Image files</div><div class="stat-value">${rows.filter(x=>['.jpg','.jpeg','.png'].includes(extOf(x.att.originalName))).length}</div><div class="stat-foot">Image attachments</div></div></div><div class="panel"><div class="toolbar"><input id="librarySearch" placeholder="Search filename, Claim ID or category…" style="flex:1;min-width:210px"><select id="libraryClaimFilter" style="max-width:240px"><option value="">All claims</option>${state.claims.map(c=>`<option value="${escapeHTML(c.id)}">${escapeHTML(c.id)}</option>`).join('')}</select><select id="libraryTypeFilter" style="max-width:160px"><option value="">All file types</option><option value="pdf">PDF</option><option value="image">Images</option><option value="docx">DOCX</option></select></div><div class="panel-body"><div class="dropzone" id="libraryDrop"><b>Drop files here or paste a screenshot (Ctrl + V)</b><small>PDF, JPG, JPEG, PNG and DOCX · Up to 25 MB per file</small><div class="mt-12"><button class="btn btn-secondary btn-small" type="button" data-action="library-upload">Browse files</button><input id="libraryPicker" type="file" accept=".pdf,.jpg,.jpeg,.png,.docx" multiple hidden></div></div><div id="libraryResults" class="library-list">${renderLibraryRows(rows)}</div></div></div><div class="info-box mt-12">Files remain linked to their claim records. In local-server mode, attachment content is stored in this SANDfil installation's DATA folder. Export a full backup regularly.</div>`}
function renderLibraryRows(rows){if(!rows.length)return '<div class="empty"><strong>No supporting documents found</strong><p>Upload files and link them to an existing claim.</p></div>';return rows.map(({claim:c,att:a,filename,category})=>`<div class="library-row" data-library-row><div class="library-file-icon">${extOf(a.originalName)==='.pdf'?'PDF':['.jpg','.jpeg','.png'].includes(extOf(a.originalName))?'IMG':'DOC'}</div><div class="library-file-main"><strong>${escapeHTML(filename)}</strong><small>${escapeHTML(c.id)} · ${escapeHTML(category)} · ${formatBytes(a.size)} · ${escapeHTML(a.originalName)}</small><div class="library-rename"><input aria-label="Rename file" data-library-rename="${escapeHTML(a.id)}" value="${escapeHTML(filename)}"><button class="btn btn-secondary btn-small" data-action="library-rename" data-id="${escapeHTML(a.id)}">Save name</button></div></div><div class="library-actions"><button class="btn btn-secondary btn-small" data-action="library-preview" data-id="${escapeHTML(a.id)}">Preview</button><button class="btn btn-primary btn-small" data-action="library-download" data-id="${escapeHTML(a.id)}">Download</button><button class="btn btn-danger btn-small" data-action="library-remove" data-id="${escapeHTML(a.id)}">Remove</button><button class="btn btn-secondary btn-small" data-action="view" data-id="${escapeHTML(c.id)}">Claim</button></div></div>`).join('')}
function filterLibrary(){const q=($('#librarySearch')?.value||'').toLowerCase().trim(),claim=$('#libraryClaimFilter')?.value||'',type=$('#libraryTypeFilter')?.value||'';let rows=allLibraryFiles().filter(x=>{const hay=[x.filename,x.att.originalName,x.claim.id,x.category].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(claim&&x.claim.id!==claim)return false;const ext=extOf(x.att.originalName);if(type==='pdf'&&ext!=='.pdf')return false;if(type==='image'&&!['.jpg','.jpeg','.png'].includes(ext))return false;if(type==='docx'&&ext!=='.docx')return false;return true});$('#libraryResults').innerHTML=renderLibraryRows(rows)}
function findLibraryAttachment(id){for(const c of state.claims){const a=(c.attachments||[]).find(x=>x.id===id);if(a&&a.fileId)return {claim:c,att:a}}return null}
async function libraryPreview(id){const x=findLibraryAttachment(id);if(!x)return;const win=window.open('about:blank','_blank');try{const blob=await getFile(x.att.fileId);if(!blob)throw new Error('File not found in storage.');const url=URL.createObjectURL(blob);if(win){win.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}else{downloadBlob(blob,x.att.originalName)}}catch(e){if(win)win.close();showToast(e.message,true)}}

async function libraryRemove(id){const x=findLibraryAttachment(id);if(!x)return;const ok=await openModal('Remove attachment?',`<p>Remove <strong>${escapeHTML(x.att.customFilename||x.att.originalName)}</strong> from claim <strong>${escapeHTML(x.claim.id)}</strong>?</p><p>This removes the attachment from the claim and deletes its stored file. This cannot be undone except by restoring a backup.</p>`,[{label:'Cancel',value:'cancel'},{label:'Remove file',value:'remove',class:'btn-danger'}]);if(ok!=='remove')return;await deleteFile(x.att.fileId);x.claim.attachments=x.claim.attachments.filter(a=>a.id!==id);x.claim.updatedAt=new Date().toISOString();await persistState();renderPage();showToast('Attachment removed.')}
async function libraryUploadFiles(fileList){const files=Array.from(fileList||[]);if(!files.length)return;const claimOptions=state.claims.map(c=>`<option value="${escapeHTML(c.id)}">${escapeHTML(c.id)} — ${escapeHTML(c.claimDate||'')}</option>`).join('');if(!claimOptions){showToast('Create and save a claim before uploading files to the Document Library.',true);return}const body=`<div class="field"><label>Link to claim</label><select id="libUploadClaim">${claimOptions}</select></div><div class="field mt-12"><label>Attachment category</label><select id="libUploadCategory">${state.settings.attachmentCategories.map(c=>`<option value="${escapeHTML(c.id)}">${escapeHTML(c.name)}</option>`).join('')}</select></div><div class="field mt-12"><label>Filename format</label><select id="libUploadFormat"><option value="auto">Date + Claim ID + Category</option><option value="original">Keep original filename</option><option value="custom">Custom filename (per file)</option></select></div><div class="info-box mt-12">${files.length} file(s) selected. Files are limited to 25 MB each. Unsupported formats will be skipped.</div><div id="libUploadNames" class="library-upload-names">${files.map((f,i)=>`<div>${escapeHTML(f.name)} <small>${formatBytes(f.size)}</small>${i===0?'<input id="libCustomName" placeholder="Optional custom filename (first file only)" class="mt-12">':''}</div>`).join('')}</div>`;const choice=await openModal('Upload supporting documents',body,[{label:'Cancel',value:'cancel'},{label:'Save attachments',value:'save',class:'btn-primary'}]);if(choice!=='save')return;const claim=state.claims.find(c=>c.id===$('#libUploadClaim').value);const cat=categoryById($('#libUploadCategory').value);const format=$('#libUploadFormat').value;let saved=0,skipped=0;for(let i=0;i<files.length;i++){const f=files[i],ext=extOf(f.name);if(!['.pdf','.jpg','.jpeg','.png','.docx'].includes(ext)||f.size>25*1024*1024){skipped++;continue}const a=emptySlot(0);a.categoryId=cat.id;a.fileId=uid('file');a.originalName=f.name;a.mimeType=f.type||'application/octet-stream';a.size=f.size;let suggested=format==='original'?f.name:`${claim.claimDate||today()}_${slug(claim.id)}_${slug(cat.name)}${ext}`;if(format==='custom'&&i===0&&$('#libCustomName').value.trim())suggested=$('#libCustomName').value.trim()+extOf(f.name);a.customFilename=suggested;a.filenameManuallyEdited=format!=='auto';try{await putFile(a.fileId,f,f.name,a.mimeType,{claimId:claim.id,claimDate:claim.claimDate,savedName:suggested,category:cat.name});claim.attachments=claim.attachments||[];claim.attachments.push(a);claim.updatedAt=new Date().toISOString();saved++}catch(e){skipped++;console.error(e)}}await persistState();renderPage();showToast(`${saved} file(s) saved${skipped?`; ${skipped} skipped`:''}.`,skipped>0,6000)}

async function handleClick(ev){const btn=ev.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;
 if(action==='nav'){if(page==='form'&&editor){const leave=await openModal('Leave claim editor?',`<p>The changes in this form have not been saved unless you selected Save Draft or Mark as Ready to Enter.</p><p>Leave this form?</p>`,[{label:'Stay here',value:'stay'},{label:'Discard unsaved changes',value:'leave',class:'btn-danger'}]);if(leave!=='leave')return;editor=null;activeClaimId=null}go(btn.dataset.page);return}
 if(action==='new-claim'){if(page==='form'&&editor){const leave=await openModal('Start a new claim?',`<p>Any unsaved changes in the current form will be discarded.</p>`,[{label:'Cancel',value:'cancel'},{label:'Discard & New',value:'new',class:'btn-primary'}]);if(leave!=='new')return}startNew();return}
 if(action==='view'){viewClaim(id);return}if(action==='edit'){editClaim(id);return}if(action==='duplicate'){duplicateClaim(id);return}if(action==='delete'){await deleteClaim(id);return}
 if(action==='cancel-form'){const leave=await openModal('Cancel editing?',`<p>Unsaved changes in this form will be discarded.</p>`,[{label:'Keep editing',value:'stay'},{label:'Discard changes',value:'leave',class:'btn-danger'}]);if(leave==='leave'){editor=null;activeClaimId=null;go('claims')}return}
 if(action==='save-draft'){await saveEditor('draft');return}if(action==='mark-ready'){await saveEditor('ready');return}if(action==='add-receipt'){collectFormIntoEditor();editor.receipts.push({id:uid('receipt'),value:''});renderPage();return}if(action==='remove-receipt'){collectFormIntoEditor();if(editor.receipts.length<=1){editor.receipts[0].value=''}else editor.receipts=editor.receipts.filter(r=>r.id!==id);renderPage();return}
 if(action==='library-upload'){if($('#libraryPicker'))$('#libraryPicker').click();return}if(action==='library-rename'){await libraryRename(id);return}if(action==='library-preview'){await libraryPreview(id);return}if(action==='library-download'){await libraryDownload(id);return}if(action==='library-remove'){await libraryRemove(id);return}if(action==='add-attachment'){collectFormIntoEditor();editor.attachments.push(emptySlot(editor.attachments.length));rerenderAttachmentList();return}if(action==='remove-attachment'){await removeAttachment(id);return}if(action==='preview-attachment'){await previewAttachment(id);return}if(action==='download-attachment'){await downloadAttachment(id);return}
 if(action==='copy-summary'){const c=state.claims.find(x=>x.id===id);if(c)await copyText(createSummaryText(c));return}if(action==='download-summary'){const c=state.claims.find(x=>x.id===id);if(c){downloadText(createSummaryText(c),nameForSummary(c));showToast('Claim summary TXT downloaded.')}return}if(action==='mark-ready-saved'){await markSavedReady(id);return}if(action==='mark-entered'){await markEntered(id);return}

 if(action==='export-backup'){await exportBackup();return}if(action==='choose-import'){$('#importBackupFile').click();return}if(action==='export-csv'){exportClaimsCSV();return}if(action==='export-attachments-csv'){exportAttachmentCSV();return}
 if(action==='save-category'){await saveCategory(id);return}if(action==='delete-category'){const cat=categoryById(id);const ok=await openModal('Remove attachment category?',`<p>Remove <strong>${escapeHTML(cat.name)}</strong> from Settings?</p><p>Existing claims may retain a category ID that is no longer listed. Required checks for this category will no longer be configured.</p>`,[{label:'Cancel',value:'cancel'},{label:'Remove',value:'remove',class:'btn-danger'}]);if(ok==='remove'){state.settings.attachmentCategories=state.settings.attachmentCategories.filter(x=>x.id!==id);await persistState();renderPage();showToast('Category removed.')}return}
 if(action==='save-element'){await saveElement(id);return}if(action==='delete-element'){if(state.settings.claimElements.length<=1)return showToast('At least one claim element must remain.',true);const el=elementById(id);const ok=await openModal('Remove claim element?',`<p>Remove <strong>${escapeHTML(el.name)}</strong> from Settings?</p><p>Existing saved records keep their stored claim element name, but new claims cannot select this element.</p>`,[{label:'Cancel',value:'cancel'},{label:'Remove',value:'remove',class:'btn-danger'}]);if(ok==='remove'){state.settings.claimElements=state.settings.claimElements.filter(x=>x.id!==id);await persistState();renderPage();showToast('Claim element removed.')}return}

 if(el.id==='claimSearch'||el.id==='filterFromDate'||el.id==='filterToDate')filterClaims();if(['librarySearch','libraryClaimFilter','libraryTypeFilter'].includes(el.id))filterLibrary();}

function handleSubmit(ev){if(ev.target.id==='addCategoryForm'){ev.preventDefault();const n=$('#newCategoryName').value.trim();if(!n)return;state.settings.attachmentCategories.push({id:uid('cat'),name:n,requiredForTravel:false,requiredForAll:false});persistState().then(()=>{renderPage();showToast('Attachment category added.')});return}if(ev.target.id==='addElementForm'){ev.preventDefault();const name=$('#newElementName').value.trim();if(!name)return;state.settings.claimElements.push({id:uid('el'),name,kind:$('#newElementKind').value,unit:$('#newElementUnit').value});persistState().then(()=>{renderPage();showToast('Claim element added.')});return}}

$('#main').addEventListener('click',handleClick);document.querySelector('.topbar').addEventListener('click',handleClick);$('#mobileNav').addEventListener('click',handleClick);$('#sideNav').addEventListener('click',handleClick);$('#modalBackdrop').addEventListener('click',handleClick);$('#main').addEventListener('input',handleInput);$('#main').addEventListener('change',handleChange);$('#main').addEventListener('submit',handleSubmit);$('#modalBackdrop').addEventListener('click',ev=>{if(ev.target===$('#modalBackdrop'))closeModal('cancel')});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modalBackdrop').classList.contains('open'))closeModal('cancel')});

async function writeCloud(data){
 if(!user||!ready)return;
 if(busy){pendingWrite=JSON.parse(JSON.stringify(data));return;}
 busy=true;status("☁ Syncing…");
 try{await setDoc(cloudRef(),{data,updatedAt:serverTimestamp(),schemaVersion:1},{merge:true});status("☁ Cloud synced");}

 finally{busy=false;if(pendingWrite&&user&&ready){const next=pendingWrite;pendingWrite=null;writeCloud(next).catch(console.error);}}

 while(!window.__sandfilBridge || !window.__sandfilReady){if(Date.now()-start>15000)throw new Error("SANDfil local database did not initialise. Refresh and try again.");await new Promise(r=>setTimeout(r,100));}
 await window.__sandfilReady;
 return window.__sandfilBridge;
}
async function connect(u){
 user=u;ready=false;ui();
 try{
   const bridge=await waitBridge();
   const local=bridge.getState();
   const snap=await getDoc(cloudRef());
   if(snap.exists()&&snap.data()?.data){
     const combined=merge(local,snap.data().data);
     await bridge.applyCloudState(combined);
   }else{
   }
   ready=true;
   await writeCloud(bridge.getState());
   status("☁ Cloud synced");
   ui();
 }catch(e){
   console.error("SANDfil cloud setup failed",e);ready=false;status("☁ Cloud setup error",true);
   alert("Google sign-in worked, but SANDfil cloud sync could not finish. Check your Firestore rules. Details: "+(e.message||e));
 }
}
window.sandfilCloud={
 isReady:()=>!!(user&&ready),
 queueSync:data=>{if(!user||!ready)return;clearTimeout(timer);const copy=JSON.parse(JSON.stringify(data));timer=setTimeout(()=>writeCloud(copy).catch(console.error),600);}
};
inBtn?.addEventListener("click",async()=>{try{await signInWithPopup(auth,provider);}catch(e){console.error(e);alert("Google sign-in failed: "+(e.message||e));}});
outBtn?.addEventListener("click",async()=>{try{await signOut(auth);user=null;ready=false;ui();}catch(e){alert("Sign out failed: "+(e.message||e));}});
onAuthStateChanged(auth,u=>{if(u)connect(u);else{user=null;ready=false;ui();}});
</script>
